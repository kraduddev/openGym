
name: opengym

services:
  api:
    image: ghcr.io/duartesantos8/opengym-api:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3000}
      DATA_DIR: /data
      TRUST_PROXY: ${TRUST_PROXY:-1}
    expose:
      - "3000"
    volumes:
      - opengym_data:/data
    networks:
      - internal

  web:
    image: ghcr.io/duartesantos8/opengym-web:latest
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "80"
    environment:
      NGINX_PORT: 80
      BACKEND: api
      PORT: 3000
      RESOLVER: 127.0.0.11
      MEDIA_UPLOAD_MAX: ${MEDIA_UPLOAD_MAX:-48m}
    networks:
      - internal
      - deploy-network

volumes:
  opengym_data:

networks:
  internal:
    driver: bridge

  dokploy-network:
    external: true
