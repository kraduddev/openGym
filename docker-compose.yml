
name: opengym

services:
  api:
    image: ghcr.io/duartesantos8/opengym-api:latest
    restart: unless-stopped

    environment:
      PORT: "3000"
      DATA_DIR: /data
      TRUST_PROXY: "1"
      RP_ID: ${RP_ID}
      ORIGIN: ${ORIGIN}
      FIRST_USER_ADMIN: ${FIRST_USER_ADMIN:-1}
      INVITE_ONLY: ${INVITE_ONLY:-0}
      ALLOW_GUEST: "0"
      PASSWORD_LOGIN: "0"
      COACH_DISABLED: "1"

    volumes:
      - opengym_data:/data

    networks:
      - internal

  web:
    image: ghcr.io/duartesantos8/opengym-web:latest
    restart: unless-stopped

    depends_on:
      - api

    environment:
      NGINX_PORT: "80"
      BACKEND: api
      PORT: "3000"
      RESOLVER: 127.0.0.11
      MEDIA_UPLOAD_MAX: 48m

    networks:
      - internal
      - dokploy-network

volumes:
  opengym_data:

networks:
  internal:
    driver: bridge

  dokploy-network:
    external: true
